name: Build and Release macOS App

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

env:
  APP_NAME: "KimaiClock"
  XCODE_PROJECT: "KimaiClock.xcodeproj"
  SCHEME: "KimaiClock"
  CONFIGURATION: "Release"
  TAP_REPO: "clemens-code/homebrew-tap"

jobs:
  build-and-release:
    runs-on: macos-26
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
    - name: Validate tag
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"

        delete_tag() {
          echo "Deleting invalid tag '$TAG_NAME' from remote..."
          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG_NAME" --method DELETE
        }

        if ! [[ "$TAG_NAME" == v* ]]; then
          echo "Error: tag must start with 'v' (e.g. v1.2.3), got '$TAG_NAME'"
          delete_tag
          exit 1
        fi

        VERSION="${TAG_NAME#v}"

        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: '$TAG_NAME' is not valid semver (expected vX.Y.Z)"
          delete_tag
          exit 1
        fi

        LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || echo "0.0.0")
        LATEST=${LATEST:-0.0.0}
        echo "Current latest release: $LATEST — new version: $VERSION"
        if ! python3 -c "a=tuple(int(x) for x in '$LATEST'.split('.'));b=tuple(int(x) for x in '$VERSION'.split('.'));exit(0 if b>a else 1)"; then
          echo "Error: version $VERSION is not greater than current latest $LATEST"
          delete_tag
          exit 1
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Bump version and build number
      id: version_bump
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        CURRENT_BUILD=$(grep -m1 "CURRENT_PROJECT_VERSION" KimaiClock.xcodeproj/project.pbxproj | grep -o '[0-9]*')
        NEW_BUILD=$((CURRENT_BUILD + 1))
        echo "Bumping to version $VERSION, build $NEW_BUILD"
        sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $VERSION/" KimaiClock.xcodeproj/project.pbxproj
        sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $NEW_BUILD/" KimaiClock.xcodeproj/project.pbxproj
        echo "new_build=$NEW_BUILD" >> $GITHUB_OUTPUT

    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
      with:
        path: ./
        extra_args: --only-verified

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Install create-dmg
      run: brew install create-dmg

    # no Apple Developer account -> build unsigned, then ad-hoc sign so the bundle has a valid seal
    - name: Build App
      run: |
        xcodebuild \
          -project "$XCODE_PROJECT" \
          -scheme "$SCHEME" \
          -configuration "$CONFIGURATION" \
          -destination "generic/platform=macOS" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          build

        mkdir -p export
        cp -R "build/Build/Products/$CONFIGURATION/$APP_NAME.app" export/
        codesign --force --deep --sign - "export/$APP_NAME.app"
        codesign --verify --deep --verbose "export/$APP_NAME.app"
        lipo -archs "export/$APP_NAME.app/Contents/MacOS/$APP_NAME"

    - name: Create DMG
      run: |
        create-dmg \
          --volname "$APP_NAME" \
          --background "$GITHUB_WORKSPACE/assets/background.tiff" \
          --volicon "$GITHUB_WORKSPACE/assets/volicon.icns" \
          --window-size 600 400 \
          --icon-size 128 \
          --icon "$APP_NAME.app" 150 150 \
          --hide-extension "$APP_NAME.app" \
          --app-drop-link 450 150 \
          "$APP_NAME.dmg" \
          "export/" \
        || echo "Warning: create-dmg completed with warnings (this is often normal)"

        test -s "$APP_NAME.dmg"

    - name: Compute DMG SHA256
      id: dmg_info
      run: |
        SHA256=$(shasum -a 256 "$APP_NAME.dmg" | awk '{print $1}')
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "SHA256: $SHA256"

    - name: Get release info
      id: release_info
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        VERSION="${VERSION#v}"
        echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: ${{ steps.release_info.outputs.tag_name }}
        draft: false
        prerelease: false
        files: |
          ${{ env.APP_NAME }}.dmg
        body: |
          ### Install with Homebrew (recommended)

          ```bash
          brew install --cask ${{ env.TAP_REPO }}/kimai-clock
          ```

          ### Manual install

          1. Download `KimaiClock.dmg` and drag the app into your Applications folder.
          2. The app is **not notarized by Apple**, so macOS blocks the first launch. Allow it once with:
             ```bash
             xattr -dr com.apple.quarantine /Applications/KimaiClock.app
             ```

          SHA256: `${{ steps.dmg_info.outputs.sha256 }}`

    - name: Commit version bump to main
      run: |
        VERSION="${{ steps.release_info.outputs.version }}"
        NEW_BUILD="${{ steps.version_bump.outputs.new_build }}"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add KimaiClock.xcodeproj/project.pbxproj
        git commit -m "chore: bump version to $VERSION (build $NEW_BUILD)"
        git push origin HEAD:main

    - name: Update Homebrew cask
      run: |
        VERSION="${{ steps.release_info.outputs.version }}"
        SHA256="${{ steps.dmg_info.outputs.sha256 }}"

        cat > kimai-clock.rb << EOF
        cask "kimai-clock" do
          version "$VERSION"
          sha256 "$SHA256"

          url "https://github.com/$GITHUB_REPOSITORY/releases/download/v#{version}/KimaiClock.dmg"
          name "KimaiClock"
          desc "Track and manage Kimai 2 time entries from the menu bar"
          homepage "https://github.com/$GITHUB_REPOSITORY"

          depends_on macos: :sequoia

          app "KimaiClock.app"

          # not notarized (no Apple Developer account) -> drop the quarantine flag so Gatekeeper allows the launch
          postflight_steps do
            run "/usr/bin/xattr",
                args:           ["-dr", "com.apple.quarantine", "{{appdir}}/KimaiClock.app"],
                writable_paths: ["{{appdir}}/KimaiClock.app"]
          end

          uninstall quit: "de.foraum.KimaiClock"
        end
        EOF
        cat kimai-clock.rb

        # first release creates the file, later ones need its current sha
        CURRENT_SHA=$(gh api "repos/$TAP_REPO/contents/Casks/kimai-clock.rb" --jq .sha 2>/dev/null || true)
        gh api "repos/$TAP_REPO/contents/Casks/kimai-clock.rb" \
          --method PUT \
          -f message="chore: bump kimai-clock to $VERSION" \
          -f content="$(base64 < kimai-clock.rb | tr -d '\n')" \
          ${CURRENT_SHA:+-f sha="$CURRENT_SHA"}
      env:
        GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    - name: Rollback release on failure
      if: failure()
      run: |
        VERSION="${{ steps.release_info.outputs.version }}"
        if [ -z "$VERSION" ]; then
          echo "Version not set, nothing to roll back."
          exit 0
        fi
        echo "Rolling back release v$VERSION..."
        gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null && echo "Release deleted." || echo "Release not found, skipping."
        gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION" --method DELETE 2>/dev/null && echo "Tag deleted." || echo "Tag not found, skipping."
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Job summary
      if: always()
      run: |
        VERSION="${{ steps.release_info.outputs.version }}"
        SHA256="${{ steps.dmg_info.outputs.sha256 }}"
        if [ -n "$VERSION" ]; then
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          printf '## Release summary\n\n| | |\n|---|---|\n| **Version** | `v%s` |\n| **SHA256** | `%s` |\n| **Release** | %s |\n' \
            "$VERSION" "$SHA256" "$RELEASE_URL" >> $GITHUB_STEP_SUMMARY
        else
          echo "## Release failed — no version was produced." >> $GITHUB_STEP_SUMMARY
        fi
